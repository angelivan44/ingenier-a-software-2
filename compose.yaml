# Entorno local: levanta el servidor y Postgres con `docker compose up --build`.
# Las credenciales son solo para desarrollo.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/acortador?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acortador
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acortador"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos:
